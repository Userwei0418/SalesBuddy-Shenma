# HTTPS reverse proxy for the WeChat/browser entrypoint.
#
# The certificate files are managed by certbot on the server and must not be
# committed to the repository. The ACME webroot is /var/www/sales-acme.

server {
    listen 80;
    listen [::]:80;
    server_name www.ericepc.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/sales-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.ericepc.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.ericepc.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/www.ericepc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ericepc.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ericepc_tls:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 102m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 150s;
    }

    location = /admin {
        proxy_pass http://127.0.0.1:8080/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"NOT_FOUND"}';
    }
}
