<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>神码 SalesBuddy · 公司管理员激活</title><link rel="stylesheet" href="/admin/assets/platform.css"><script type="module" src="/admin/assets/company-activate.js"></script></head><body>
<header class="platform-header"><a href="/admin"><img src="/admin/assets/brand-white.svg" alt="神码 SalesBuddy"></a><span class="surface-label">公司管理员激活</span></header>
<main class="activation-main"><section class="auth-card"><span class="eyebrow">COMPANY ACTIVATION</span><h1>激活你的公司账号</h1><p>仅供新公司的首位管理员使用。公司成员请使用管理员开通的账号直接登录。</p><form id="activation-form"><label>公司码<input name="company_code" required maxlength="48" autocomplete="organization" placeholder="平台交付的公司码"></label><label>一次性激活码<input name="activation_token" type="password" autocomplete="off" required placeholder="平台交付的 24 小时有效激活码"></label><label>设置密码<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="8–128 个字符"></label><label>再次输入密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="再次输入同一密码"></label><p id="activation-status" role="status"></p><button class="primary">激活管理员</button></form><div id="activation-success" hidden><h2>密码已设置</h2><p>请联系平台检查并启用公司。启用后，使用公司账号进入公司管理。</p></div><p><a id="company-login-link" href="/admin">返回公司管理登录 →</a></p><details class="help"><summary>激活码与验证码有什么不同？</summary><p>激活码由平台开通公司时交付，只使用一次。这里不需要平台账号，也不需要手机验证器。</p></details></section><footer class="page-footer">神码 SalesBuddy · 公司管理员激活</footer></main></body></html>
