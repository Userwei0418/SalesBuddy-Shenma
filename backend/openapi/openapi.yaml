      description: 为当前身份可见的所选活动时间范围客户补齐缺评分任务。只入队不直接调用模型，不代替他人生成评分；已有任务复用，终态十分钟内不重复入队。status 为 ready/updating/unavailable；不会制造默认坐标或改变活跃客户集合。省略
        activity_window 时保持旧版当年口径，与地图读取一致。quarter 默认只补评本页200条；page_size/offset 与 GET 相同，显式分页时只处理指定页。all
        在鉴权及所选成员范围检查后返回 unavailable / BATTLE_MAP_ALL_REFRESH_DISABLED，0入队；不执行幂等写入。scope 仅支持 self/person/team；部门级目标范围不属于作战地图接口契约。
