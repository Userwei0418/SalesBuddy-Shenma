  /api/v1/customers/{customer_id}/opportunities/save-requests/{request_key}:
    get:
      description: 只读查询当前账号在该客户下原 Idempotency-Key 的商机保存回执，复核当前客户和商机读取权限。committed 仅返回完整保存标识；unresolved
        不代表未保存，原请求可能仍在执行。cancelled 表示原 key 已被永久终止，迟到的原提交不能再写入。查询失败或权限撤回同样不能证明原提交失败，客户端须保留原 key，不得换 key
        重建。仅适用于 POST /customers/{customer_id}/opportunities；无自动过期，无业务写入。
      operationId: opportunity_save_receipt_api_v1_customers__customer_id__opportunities_save_requests__request_key__get
      parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          title: Customer Id
          type: string
      - in: path
        name: request_key
        required: true
        schema:
          format: uuid
          title: Request Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    cancelled: '#/components/schemas/OpportunitySaveCancelled'
                    committed: '#/components/schemas/OpportunitySaveCommitted'
                    unresolved: '#/components/schemas/OpportunitySaveUnresolved'
                  propertyName: status
                oneOf:
                - $ref: '#/components/schemas/OpportunitySaveCommitted'
                - $ref: '#/components/schemas/OpportunitySaveUnresolved'
                - $ref: '#/components/schemas/OpportunitySaveCancelled'
                title: Response Opportunity Save Receipt Api V1 Customers  Customer Id  Opportunities
                  Save Requests  Request Key  Get
          description: Successful Response
        '404':
          description: 当前客户或结果商机不可读；不证明原提交失败
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Opportunity Save Receipt
      tags:
      - Customers
  /api/v1/customers/{customer_id}/opportunities/save-requests/{request_key}/cancel:
    post:
      description: 终止当前账号该客户下的原商机提交，使用与原保存相同的事务锁。已提交返回 committed 与原回执，不撤销业务；尚未提交则永久封住原 key 并返回 cancelled。后续同
        key 商机 POST 被 409 OPPORTUNITY_SAVE_CANCELLED 拒绝。超时、权限拒绝或 unresolved 均不能证明终止成功，须保留 key 继续查询。无需原业务内容，不删除回执，不自动过期。
      operationId: cancel_customer_opportunity_save_api_v1_customers__customer_id__opportunities_save_requests__request_key__cancel_post
      parameters:
      - in: path
        name: customer_id
        required: true
        schema:
          format: uuid
          title: Customer Id
          type: string
      - in: path
        name: request_key
        required: true
        schema:
          format: uuid
          title: Request Key
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                discriminator:
                  mapping:
                    cancelled: '#/components/schemas/OpportunitySaveCancelled'
                    committed: '#/components/schemas/OpportunitySaveCommitted'
                    unresolved: '#/components/schemas/OpportunitySaveUnresolved'
                  propertyName: status
                oneOf:
                - $ref: '#/components/schemas/OpportunitySaveCommitted'
                - $ref: '#/components/schemas/OpportunitySaveUnresolved'
                - $ref: '#/components/schemas/OpportunitySaveCancelled'
                title: Response Cancel Customer Opportunity Save Api V1 Customers  Customer Id  Opportunities
                  Save Requests  Request Key  Cancel Post
          description: Successful Response
        '404':
          description: 当前客户或已提交商机不可读；不证明终止成功
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Cancel Customer Opportunity Save
      tags:
      - Customers
