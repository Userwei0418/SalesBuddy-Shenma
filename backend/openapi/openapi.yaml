        trade_relation=distributor，必须传 exclude_customer_id，可选 exclude_opportunity_id；不得同时传 customer_id
        或其他 trade_relation，冲突返回 422。普通贸易关系与排除筛选不推断查询用途；读取范围不授予修改、录入或实际登记权限。owner_id 精确筛选稳定成员ID，优先于兼容参数
        owner。owner_options 为授权的当前成员目录（id/name/account_code/team_ids），不从商机记录推导；team_options 保留空团队，defaults.team_id
        为当前人可选的有效主团队或 null。include_overview=true 时额外返回 overview，统计与 summary.total 相同的完整筛选结果，不受分页影响；overview_year
        必填，overview_quarters 为空表示跨年，1至4全选表示该年全年。原 year/quarters/close_period 仍按预计关单时间筛选商机；overview 的 won
