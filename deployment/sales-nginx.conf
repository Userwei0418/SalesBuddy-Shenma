server {
    listen 443 ssl;
    listen 28899 ssl;
    server_name salesbuddy.shenzhoukuntai.com;
    ssl_certificate /etc/shenma-sales/tls/server.crt;
    ssl_certificate_key /etc/shenma-sales/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 102m;
    location = / { return 302 /admin; }
    location = /api/v1/admin/unified-model-key {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
    # Compress only Web assets; keep API and streaming responses unchanged.
    location ~ ^/(workspace|web)/.*\.(js|css|svg)$ {
        gzip on;
        gzip_vary on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types application/javascript text/javascript text/css image/svg+xml;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 150s;
    }
}
