name: Customer source checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  sales-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: |
          python -m pip install uv
          cd backend
          uv sync --frozen --all-extras
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Verify customer isolation
        run: python scripts/check_isolation.py
      - name: Backend unit suite
        run: cd backend && python -m pytest tests -q
      - name: Migration checks
        run: PYTHONPATH=backend:backend/src python -m pytest database/tests -q
      - name: Frontend suite
        run: node --test frontend/tests/*.test.js
      - name: Fresh PostgreSQL integration suite
        run: python backend/tests/system/run_integration_postgres.py
