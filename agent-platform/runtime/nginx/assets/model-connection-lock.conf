# Deployment switch, managed by deployment/configure-model-connection-lock.py.
# Kept in the existing read-only /opt/brand mount; no image rebuild required.
map $host $model_connections_locked {
    default 0;
}
map $request_method $model_connection_write {
    default 1;
    GET 0;
    HEAD 0;
    OPTIONS 0;
}
map "$model_connection_write:$uri" $model_connection_change {
    default 0;
    ~^1:/console/api/workspaces/current/(model-providers|default-model)(/|$) 1;
}
map "$model_connections_locked:$model_connection_change" $model_connection_denied {
    default 0;
    "1:1" 1;
}
