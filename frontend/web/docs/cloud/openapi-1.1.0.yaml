info:
  title: Raccoon SalesBuddy Sales SaaS API
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/admin/agent-config:
    get:
      operationId: get_agent_config_api_v1_admin_agent_config_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Agent Config Api V1 Admin Agent Config Get
                type: object
          description: Successful Response
      security:
      - HTTPBearer: []
      summary: Get Agent Config
      tags:
      - System configuration
    put:
      operationId: update_agent_config_api_v1_admin_agent_config_put
      parameters:
      - description: 同一次提交及响应不确定后的重试使用同一 UUID；新的提交使用新 UUID。相同标识和内容回放结果，标识相同但内容不同返回 409。旧客户端可省略。
        in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          description: 同一次提交及响应不确定后的重试使用同一 UUID；新的提交使用新 UUID。相同标识和内容回放结果，标识相同但内容不同返回 409。旧客户端可省略。
          title: Idempotency-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRuntimeConfigUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Agent Config Api V1 Admin Agent Config Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Update Agent Config
      tags:
      - System configuration
  /api/v1/admin/agent-config/releases:
    get:
      operationId: get_agent_config_releases_api_v1_admin_agent_config_releases_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          maximum: 200
          minimum: 1
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Agent Config Releases Api V1 Admin Agent Config Releases Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - HTTPBearer: []
      summary: Get Agent Config Releases
      tags:
      - System configuration
  /api/v1/admin/agent-config/releases/{version}/rollback:
    post:
      operationId: rollback_agent_config_api_v1_admin_agent_config_releases__version__rollback_post
      parameters:
      - in: path
        name: version
        required: true
        schema:
          maximum: 2147483646
          minimum: 1
          title: Version
          type: integer
      - description: 同一次提交及响应不确定后的重试使用同一 UUID；新的提交使用新 UUID。相同标识和内容回放结果，标识相同但内容不同返回 409。旧客户端可省略。
        in: header
        name: Idempotency-Key
        required: false
        schema:
          anyOf:
          - format: uuid
